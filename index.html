<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>數位有聲繪本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .book-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .book-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 10;
      cursor: pointer;
    }
    .touch-left { left: 0; }
    .touch-right { right: 0; }

    .mute-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-size: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    .mute-btn:active { transform: scale(0.9); }

    .page-indicator {
      position: absolute;
      bottom: 15px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.8);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="book-container">
    <img id="book-img" class="book-image" src="" alt="繪本圖片">

    <!-- 左右點擊翻頁 -->
    <div class="touch-zone touch-left" onclick="prevPage()"></div>
    <div class="touch-zone touch-right" onclick="nextPage()"></div>

    <!-- 右上角靜音開關 -->
    <button id="mute-btn" class="mute-btn" onclick="toggleMute()">🔊</button>

    <!-- 頁碼標示 -->
    <div id="page-indicator" class="page-indicator">1 / 20</div>

    <!-- 雙音軌播放器 -->
    <audio id="bgm-audio" src="" loop></audio>
    <audio id="voice-audio" src=""></audio>
  </div>

  <script>
    // -------------------------------------------------------------
    // 手動或對應 20 頁的素材資料
    // 如果第 1~2 頁用 bgm1，第 3~4 頁用 bgm2 ... 可以在這裡彈性分配！
    // -------------------------------------------------------------
    const pages = [
      { img: 'graphics/0.jpg',  voice: 'assets/speech0.mp3',  bgm: 'music/music0.mp3' },
      { img: 'graphics/1.jpg',  voice: 'assets/speech1.mp3',  bgm: 'music/music1.mp3' },
      { img: 'graphics/2.jpg',  voice: 'assets/speech2.mp3',  bgm: 'music/music2.mp3' },
      { img: 'graphics/3.jpg',  voice: 'assets/speech3.mp3',  bgm: 'music/music3.mp3' },
      { img: 'graphics/4.jpg',  voice: 'assets/speech4.mp3',  bgm: 'music/music4.mp3' },
      { img: 'graphics/5.jpg',  voice: 'assets/speech5.mp3',  bgm: 'music/music5.mp3' },
      { img: 'graphics/6.jpg',  voice: 'assets/speech6.mp3',  bgm: 'music/music6.mp3' },
      { img: 'graphics/7.jpg',  voice: 'assets/speech7.mp3',  bgm: 'music/music7.mp3' },
      { img: 'graphics/8.jpg',  voice: 'assets/speech8.mp3',  bgm: 'music/music8.mp3' },
      { img: 'graphics/9.jpg',  voice: 'assets/speech9.mp3',  bgm: 'music/music9.mp3' },
      { img: 'graphics/10.jpg', voice: 'assets/speech10.mp3', bgm: 'music/music10.mp3' },
      { img: 'graphics/11.jpg', voice: 'assets/speech11.mp3', bgm: 'music/music11.mp3' },
      { img: 'graphics/12.jpg', voice: 'assets/speech12.mp3', bgm: 'music/music12.mp3' },
      { img: 'graphics/13.jpg', voice: 'assets/speech13.mp3', bgm: 'music/music13.mp3' },
      { img: 'graphics/14.jpg', voice: 'assets/speech14.mp3', bgm: 'music/music14.mp3' },
      { img: 'graphics/15.jpg', voice: 'assets/speech15.mp3', bgm: 'music/music15.mp3' },
      { img: 'graphics/16.jpg', voice: 'assets/speech16.mp3', bgm: 'music/music16.mp3' },
      { img: 'graphics/17.jpg', voice: 'assets/speech17.mp3', bgm: 'music/music17.mp3' },
      { img: 'graphics/18.jpg', voice: 'assets/speech18.mp3', bgm: 'music/music18.mp3' },
      { img: 'graphics/19.jpg', voice: 'assets/speech19.mp3', bgm: 'music/伴奏.mp3' } // 伴奏放最後一頁
    ];

    let currentPage = 0;
    let isMuted = false;

    const imgEl = document.getElementById('book-img');
    const voiceEl = document.getElementById('voice-audio');
    const bgmEl = document.getElementById('bgm-audio');
    const muteBtn = document.getElementById('mute-btn');
    const pageIndicator = document.getElementById('page-indicator');

    // 背景音樂音量維持 30%，避免蓋過旁白語音
    bgmEl.volume = 0.3;

    function renderPage() {
      const page = pages[currentPage];
      imgEl.src = page.img;
      voiceEl.src = page.voice;
      
      // 如果下一頁的背景音樂跟這一頁不同，才重新更換 BGM 播放
      const currentBgmName = bgmEl.getAttribute('data-current');
      if (currentBgmName !== page.bgm) {
        bgmEl.src = page.bgm;
        bgmEl.setAttribute('data-current', page.bgm);
        if (!isMuted) {
          bgmEl.currentTime = 0;
          bgmEl.play().catch(err => console.log("BGM 播放需點擊互動:", err));
        }
      }

      pageIndicator.innerText = `${currentPage + 1} / ${pages.length}`;

      if (!isMuted) {
        voiceEl.currentTime = 0;
        voiceEl.play().catch(err => console.log("語音播放需點擊互動:", err));
      }
    }

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      voiceEl.muted = isMuted;
      bgmEl.muted = isMuted;
      muteBtn.innerText = isMuted ? '🔇' : '🔊';

      if (!isMuted) {
        voiceEl.currentTime = 0;
        voiceEl.play();
        bgmEl.play();
      }
    }

    // 初始化第一頁
    renderPage();
  </script>
</body>
</html>
