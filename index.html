<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>數位有聲繪本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .book-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .book-container:fullscreen,
    .book-container:-webkit-full-screen {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    .book-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 頂部進度條 */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 30;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.1s linear;
    }

    /* 左右透明點擊翻頁區 */
    .touch-zone {
      position: absolute;
      top: 60px;
      bottom: 70px;
      width: 40%;
      z-index: 10;
      cursor: pointer;
    }
    .touch-left { left: 0; }
    .touch-right { right: 0; }

    /* 右上角控制列 */
    .top-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }

    .btn, .select-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: white;
      font-size: 14px;
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.92); }
    
    .btn-icon-img {
      height: 20px;
      width: auto;
      margin-right: 4px;
    }

    .select-btn {
      outline: none;
      appearance: none;
      padding-right: 24px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 18px;
    }

    /* 正下方：頁碼與雙箭頭控制列 */
    .bottom-controls {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      padding: 4px 16px;
      border-radius: 25px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.15s ease;
    }
    .nav-btn:active { transform: scale(0.85); }
    .nav-btn img {
      width: 28px;
      height: auto;
      display: block;
    }

    .page-text {
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      font-weight: 500;
      min-width: 55px;
      text-align: center;
    }

    /* 開場遮罩居中排版 */
    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .start-cover-img {
      max-width: 60%;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .start-btn {
      font-size: 18px;
      padding: 12px 32px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
      transition: transform 0.2s;
    }
    .start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="book-container" id="book-container">
    <!-- 頂部進度條 -->
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 開場封面與開始閱讀按鈕 -->
    <div id="start-overlay" class="start-overlay">
      <img src="graphics/0.jpg" alt="封面圖片" class="start-cover-img">
      <button class="start-btn" onclick="startBook()">📖 開始閱讀</button>
    </div>

    <img id="book-img" class="book-image" src="" alt="繪本圖片">

    <!-- 左右透明觸控翻頁區 -->
    <div class="touch-zone touch-left" onclick="prevPage()"></div>
    <div class="touch-zone touch-right" onclick="nextPage()"></div>

    <!-- 右上角功能選單 -->
    <div class="top-controls">
      <select id="page-select" class="select-btn" onchange="jumpToPage(this.value)"></select>

      <button class="btn" onclick="replayVoice()">
        <img src="graphics/read.jpg" class="btn-icon-img" alt="朗讀">
        朗讀
      </button>

      <button class="btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
      <button id="mute-btn" class="btn" onclick="toggleMute()">🔊</button>
    </div>

    <!-- 正下方：左箭頭(上一頁) + 頁碼 + 右箭頭(下一頁) -->
    <div class="bottom-controls">
      <button class="nav-btn" onclick="prevPage()">
        <img src="graphics/left.jpg" alt="上一頁">
      </button>

      <div id="page-indicator" class="page-text">1 / 20</div>

      <button class="nav-btn" onclick="nextPage()">
        <img src="graphics/right.jpg" alt="下一頁">
      </button>
    </div>

    <!-- 音效播放器 -->
    <audio id="bgm-audio" src="" loop></audio>
    <audio id="voice-audio" src=""></audio>
  </div>

  <script>
    const pages = [
      { img: 'graphics/0.jpg',  voice: 'speech/speech0.mp3',  bgm: 'music/music0.mp3' },
      { img: 'graphics/1.jpg',  voice: 'speech/speech1.mp3',  bgm: 'music/music1.mp3' },
      { img: 'graphics/2.jpg',  voice: 'speech/speech2.mp3',  bgm: 'music/music2.mp3' },
      { img: 'graphics/3.jpg',  voice: 'speech/speech3.mp3',  bgm: 'music/music3.mp3' },
      { img: 'graphics/4.jpg',  voice: 'speech/speech4.mp3',  bgm: 'music/music4.mp3' },
      { img: 'graphics/5.jpg',  voice: 'speech/speech5.mp3',  bgm: 'music/music5.mp3' },
      { img: 'graphics/6.jpg',  voice: 'speech/speech6.mp3',  bgm: 'music/music6.mp3' },
      { img: 'graphics/7.jpg',  voice: 'speech/speech7.mp3',  bgm: 'music/music7.mp3' },
      { img: 'graphics/8.jpg',  voice: 'speech/speech8.mp3',  bgm: 'music/music8.mp3' },
      { img: 'graphics/9.jpg',  voice: 'speech/speech9.mp3',  bgm: 'music/music9.mp3' },
      { img: 'graphics/10.jpg', voice: 'speech/speech10.mp3', bgm: 'music/music10.mp3' },
      { img: 'graphics/11.jpg', voice: 'speech/speech11.mp3', bgm: 'music/music11.mp3' },
      { img: 'graphics/12.jpg', voice: 'speech/speech12.mp3', bgm: 'music/music12.mp3' },
      { img: 'graphics/13.jpg', voice: 'speech/speech13.mp3', bgm: 'music/music13.mp3' },
      { img: 'graphics/14.jpg', voice: 'speech/speech14.mp3', bgm: 'music/music14.mp3' },
      { img: 'graphics/15.jpg', voice: 'speech/speech15.mp3', bgm: 'music/music15.mp3' },
      { img: 'graphics/16.jpg', voice: 'speech/speech16.mp3', bgm: 'music/music16.mp3' },
      { img: 'graphics/17.jpg', voice: 'speech/speech17.mp3', bgm: 'music/music17.mp3' },
      { img: 'graphics/18.jpg', voice: 'speech/speech18.mp3', bgm: 'music/music18.mp3' },
      { img: 'graphics/19.jpg', voice: 'speech/speech19.mp3', bgm: 'music/伴奏.mp3' }
    ];

    let currentPage = 0;
    let isMuted = false;
    let hasStarted = false;

    const imgEl = document.getElementById('book-img');
    const voiceEl = document.getElementById('voice-audio');
    const bgmEl = document.getElementById('bgm-audio');
    const muteBtn = document.getElementById('mute-btn');
    const pageIndicator = document.getElementById('page-indicator');
    const pageSelect = document.getElementById('page-select');
    const progressBar = document.getElementById('progress-bar');

    const BGM_NORMAL_VOL = 0.35;
    const BGM_DUCK_VOL = 0.10;
    voiceEl.volume = 1.0;
    bgmEl.volume = BGM_NORMAL_VOL;

    pages.forEach((_, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.innerText = `第 ${index + 1} 頁`;
      pageSelect.appendChild(opt);
    });

    function startBook() {
      document.getElementById('start-overlay').style.display = 'none';
      hasStarted = true;
      
      renderPage();
      
      bgmEl.play().catch(e => console.log("BGM 啟動:", e));
      replayVoice();
    }

    function renderPage() {
      const page = pages[currentPage];
      imgEl.src = page.img;
      voiceEl.src = page.voice;
      
      pageSelect.value = currentPage;
      pageIndicator.innerText = `${currentPage + 1} / ${pages.length}`;
      progressBar.style.width = '0%';

      const currentBgmName = bgmEl.getAttribute('data-current');
      if (currentBgmName !== page.bgm) {
        bgmEl.src = page.bgm;
        bgmEl.setAttribute('data-current', page.bgm);
        if (!isMuted && hasStarted) {
          bgmEl.currentTime = 0;
          bgmEl.play().catch(e => console.log(e));
        }
      }

      if (!isMuted && hasStarted) {
        replayVoice();
      }
    }

    function replayVoice() {
      voiceEl.currentTime = 0;
      bgmEl.volume = BGM_DUCK_VOL;
      
      voiceEl.play().catch(e => console.log(e));
      if (bgmEl.paused && hasStarted && !isMuted) {
        bgmEl.play().catch(e => console.log(e));
      }
    }

    voiceEl.onended = function() {
      bgmEl.volume = BGM_NORMAL_VOL;
      progressBar.style.width = '100%';
    };

    voiceEl.ontimeupdate = function() {
      if (voiceEl.duration) {
        const pct = (voiceEl.currentTime / voiceEl.duration) * 100;
        progressBar.style.width = `${pct}%`;
      }
    };

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function jumpToPage(index) {
      currentPage = parseInt(index);
      renderPage();
    }

    function toggleMute() {
      isMuted = !isMuted;
      voiceEl.muted = isMuted;
      bgmEl.muted = isMuted;
      muteBtn.innerText = isMuted ? '🔇' : '🔊';

      if (!isMuted && hasStarted) {
        replayVoice();
        bgmEl.play();
      }
    }

    function toggleFullscreen() {
      const elem = document.getElementById('book-container');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(`無法進入全螢幕: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!hasStarted) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextPage();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevPage();
      }
    });

    renderPage();
  </script>
</body>
</html>
