<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>數位有聲繪本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .book-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* 頂部極簡播放進度條 (不遮擋繪本) */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 30;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.1s linear;
    }

    /* 全螢幕時讓容器與圖片滿版 */
    .book-container:fullscreen,
    .book-container:-webkit-full-screen {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    .book-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 開場圖片樣式 */
    .start-cover-img {
      max-width: 60%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    /* 左右點擊翻頁區 */
    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      z-index: 10;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .touch-left { left: 0; }
    .touch-right { right: 0; }

    /* 左右翻頁圖片圖示 (預設使用文字箭頭，可用圖片替換) */
    .nav-arrow {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 16px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .touch-zone:hover .nav-arrow { opacity: 1; }
    /* 若有左右箭頭圖片，取消註解下行並填入圖片路徑:
    .nav-arrow-img { width: 40px; height: 40px; }
    */

    /* 右上角控制列 */
    .top-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    .btn, .select-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: white;
      font-size: 14px;
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.92); }
    
    /* 朗讀圖片按鈕樣式 */
    .btn-icon-img {
      height: 20px;
      width: auto;
      margin-right: 4px;
    }

    .select-btn {
      outline: none;
      appearance: none;
      padding-right: 24px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 18px;
    }

    .page-indicator {
      position: absolute;
      bottom: 15px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
    }

    /* 開場「開始閱讀」遮罩層 */
    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .start-btn {
      font-size: 20px;
      padding: 14px 36px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
      transition: transform 0.2s;
    }
    .start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="book-container" id="book-container">
    <!-- 頂部進度條 -->
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 開場點擊體驗遮罩 (點擊圖片或按鈕皆可開始) -->
    <div id="start-overlay" class="start-overlay" onclick="startBook()">
      <!-- ⚠️ 請將 graphics/0.jpg 改成你的開場封面圖片檔名 -->
      <img src="graphics/spirit.jpg" alt="封面圖片" class="start-cover-img">
      
      <button class="start-btn">📖 開始閱讀</button>
    </div>

    <img id="book-img" class="book-image" src="" alt="繪本圖片">

    <!-- 左右觸控與箭頭按鈕 -->
    <div class="touch-zone touch-left" onclick="prevPage()">
      <!-- 若有左鍵圖片可改為: <img src="graphics/left.png" class="nav-arrow-img"> -->
      <img src="graphics/left.png" style="width: 40px; height: auto;">
    </div>
    <div class="touch-zone touch-right" onclick="nextPage()">
      <!-- 若有右鍵圖片可改為: <img src="graphics/right.png" class="nav-arrow-img"> -->
      <img src="graphics/right.png" style="width: 40px; height: auto;">
    </div>

    <!-- 右上角功能選單 -->
    <div class="top-controls">
      <!-- 目錄選單 -->
      <select id="page-select" class="select-btn" onchange="jumpToPage(this.value)">
      </select>

      <!-- 朗讀按鈕 -->
      <button class="btn" onclick="replayVoice()">
        <!-- ⚠️ 請確認你的朗讀圖示檔名，例如 graphics/read.png -->
        <img src="graphics/read.png" class="btn-icon-img" alt="朗讀">
        朗讀
      </button>

      <!-- 全螢幕切換按鈕 -->
      <button class="btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>

      <!-- 靜音切換按鈕 -->
      <button id="mute-btn" class="btn" onclick="toggleMute()">🔊</button>
    </div>

    <!-- 頁碼 -->
    <div id="page-indicator" class="page-indicator">1 / 20</div>

    <!-- 音效播放器 -->
    <audio id="bgm-audio" src="" loop></audio>
    <audio id="voice-audio" src=""></audio>
  </div>

  <script>
    const pages = [
      { img: 'graphics/0.jpg',  voice: 'speech/speech0.mp3',  bgm: 'music/music0.mp3' },
      { img: 'graphics/1.jpg',  voice: 'speech/speech1.mp3',  bgm: 'music/music1.mp3' },
      { img: 'graphics/2.jpg',  voice: 'speech/speech2.mp3',  bgm: 'music/music2.mp3' },
      { img: 'graphics/3.jpg',  voice: 'speech/speech3.mp3',  bgm: 'music/music3.mp3' },
      { img: 'graphics/4.jpg',  voice: 'speech/speech4.mp3',  bgm: 'music/music4.mp3' },
      { img: 'graphics/5.jpg',  voice: 'speech/speech5.mp3',  bgm: 'music/music5.mp3' },
      { img: 'graphics/6.jpg',  voice: 'speech/speech6.mp3',  bgm: 'music/music6.mp3' },
      { img: 'graphics/7.jpg',  voice: 'speech/speech7.mp3',  bgm: 'music/music7.mp3' },
      { img: 'graphics/8.jpg',  voice: 'speech/speech8.mp3',  bgm: 'music/music8.mp3' },
      { img: 'graphics/9.jpg',  voice: 'speech/speech9.mp3',  bgm: 'music/music9.mp3' },
      { img: 'graphics/10.jpg', voice: 'speech/speech10.mp3', bgm: 'music/music10.mp3' },
      { img: 'graphics/11.jpg', voice: 'speech/speech11.mp3', bgm: 'music/music11.mp3' },
      { img: 'graphics/12.jpg', voice: 'speech/speech12.mp3', bgm: 'music/music12.mp3' },
      { img: 'graphics/13.jpg', voice: 'speech/speech13.mp3', bgm: 'music/music13.mp3' },
      { img: 'graphics/14.jpg', voice: 'speech/speech14.mp3', bgm: 'music/music14.mp3' },
      { img: 'graphics/15.jpg', voice: 'speech/speech15.mp3', bgm: 'music/music15.mp3' },
      { img: 'graphics/16.jpg', voice: 'speech/speech16.mp3', bgm: 'music/music16.mp3' },
      { img: 'graphics/17.jpg', voice: 'speech/speech17.mp3', bgm: 'music/music17.mp3' },
      { img: 'graphics/18.jpg', voice: 'speech/speech18.mp3', bgm: 'music/music18.mp3' },
      { img: 'graphics/19.jpg', voice: 'speech/speech19.mp3', bgm: 'music/伴奏.mp3' } // 伴奏放最後一頁
    ];

    let currentPage = 0;
    let isMuted = false;
    let hasStarted = false;

    const imgEl = document.getElementById('book-img');
    const voiceEl = document.getElementById('voice-audio');
    const bgmEl = document.getElementById('bgm-audio');
    const muteBtn = document.getElementById('mute-btn');
    const pageIndicator = document.getElementById('page-indicator');
    const pageSelect = document.getElementById('page-select');
    const progressBar = document.getElementById('progress-bar');

    // 預設音量：朗讀 100%，BGM 靜音預設 0.35
    const BGM_NORMAL_VOL = 0.35;
    const BGM_DUCK_VOL = 0.10; // 朗讀時背景音樂降至 10%
    voiceEl.volume = 1.0;
    bgmEl.volume = BGM_NORMAL_VOL;

    // 動態填入目錄選單
    pages.forEach((_, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.innerText = `第 ${index + 1} 頁`;
      pageSelect.appendChild(opt);
    });

    // 點擊「開始閱讀」開場
    function startBook() {
      document.getElementById('start-overlay').style.display = 'none';
      hasStarted = true;
      renderPage();
    }

    function renderPage() {
      const page = pages[currentPage];
      imgEl.src = page.img;
      voiceEl.src = page.voice;
      
      // 更新目錄下拉與頁碼標示
      pageSelect.value = currentPage;
      pageIndicator.innerText = `${currentPage + 1} / ${pages.length}`;
      progressBar.style.width = '0%';

      // 換背景音樂處理
      const currentBgmName = bgmEl.getAttribute('data-current');
      if (currentBgmName !== page.bgm) {
        bgmEl.src = page.bgm;
        bgmEl.setAttribute('data-current', page.bgm);
        if (!isMuted && hasStarted) {
          bgmEl.currentTime = 0;
          bgmEl.play().catch(e => console.log(e));
        }
      }

      if (!isMuted && hasStarted) {
        replayVoice();
      }
    }

    // 重播當前頁面朗讀 + 背景音樂壓音控制
    function replayVoice() {
      voiceEl.currentTime = 0;
      // 朗讀開始時，將 BGM 音量調低以避開人聲 (Ducking)
      bgmEl.volume = BGM_DUCK_VOL;
      
      voiceEl.play().catch(e => console.log(e));
      if (bgmEl.paused && hasStarted && !isMuted) {
        bgmEl.play().catch(e => console.log(e));
      }
    }

    // 當朗讀播放完畢，自動還原 BGM 音量
    voiceEl.onended = function() {
      bgmEl.volume = BGM_NORMAL_VOL;
      progressBar.style.width = '100%';
    };

    // 音訊進度更新 (控制頂部進度條)
    voiceEl.ontimeupdate = function() {
      if (voiceEl.duration) {
        const pct = (voiceEl.currentTime / voiceEl.duration) * 100;
        progressBar.style.width = `${pct}%`;
      }
    };

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function jumpToPage(index) {
      currentPage = parseInt(index);
      renderPage();
    }

    function toggleMute() {
      isMuted = !isMuted;
      voiceEl.muted = isMuted;
      bgmEl.muted = isMuted;
      muteBtn.innerText = isMuted ? '🔇' : '🔊';

      if (!isMuted && hasStarted) {
        replayVoice();
        bgmEl.play();
      }
    }

    // 全螢幕切換
    function toggleFullscreen() {
      const elem = document.getElementById('book-container');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(`無法進入全螢幕: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }

    // 鍵盤左右鍵控制翻頁 (← 上一頁, → 下一頁)
    document.addEventListener('keydown', (e) => {
      if (!hasStarted) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextPage();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevPage();
      }
    });

    // 預設渲染第一頁背景
    renderPage();
  </script>
</body>
</html>
